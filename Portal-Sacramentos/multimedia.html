    <main>
        <section>
            <h2>Cantos Litúrgicos (Audio)</h2>
            <audio controls>
                <source src="audios/canto_liturgico.mp3" type="audio/mpeg">

        <section style="margin-top: 20px;">
            <h2>Ceremonia y Guía de Sacramentos (Video)</h2>

            </video>
        </section>

        <section style="margin-top: 20px;">
            <h2>Portal Diocesano (Iframe)</h2>
