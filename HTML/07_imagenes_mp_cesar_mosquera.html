<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07 - Imágenes | MP Control Sacramentos</title>
</head>

<body>
    <header>
        <h1>Control de Sacramentos -Registro Visual</h1>
        <p>Galeria e imagineria eclesiastica para el sistema parroquial</p>
    </header>

    <main>

        <section id="sacramento-bautismo">
            <h2>Sacramento del Bautismo</h2>
            <img src="img/bautismo.jpg" 
            alt="Seremonia de Bautismo en la pila parroquial"
            width="200" 
            loading="eager">
        </section>

        <section id="emblema-parroquial">
            <h2>Emblema Parroquial</h2>
            <img src="https://thumbs.dreamstime.com/z/logotipo-de-la-iglesia-cruz-y-paloma-del-vitral-122700108.jpg"
                 alt="Logotipo de la iglesia con cruz y paloma del vitral" 
                 width="200" 
                 loading="lazy">
        </section>

        <section id="personajes-parroquiales">
            <h2>Personajes Parroquiales</h2>
            <img src="img/personajes/parraco.jpg" 
            alt="Parraco celebrante de la parroquia" 
            width="200" 
            loading="eager">
        </section>

        <section id="sede-eclastica">
            <h2>Sede Eclastica</h2>
            <a href="https://iglesiacalatravas.com/wp-content/uploads/2025/07/matrimonio-3.webp" target="_blank">
                <img src="../imagenes/fachada.jpg" 
                alt="Fachada principal del templo parroquial" 
                width="200"
                loading="eager">
            </a>
        </section>


        <section id="enlace-certificado">
            <h2>Consulta de Certificado Canonico</h2>
            <a href="https://iglesiacalatravas.com/wp-content/uploads/2025/07/matrimonio-3.webp" target="_blank">
                <img src="../imagenes/certificado.jpg" 
                alt="Certificado Canonico de Matrimonio" width="200"
                    loading="eager">
            </a>
        </section>


        <section id="figura-consagracion">
            <h2>Registro Canonico de Matrimonio</h2>
            <figure>
                <img src="../imagenes/iglesia.jpg" alt="Registro Canonico de Matrimonio" width="200" loading="eager">
                <figcaption>
                    Celebracion sacramental del matrimonio canonico en el altar mayor
                </figcaption>
            </figure>
        </section>
    </main>
</body>

</html>
