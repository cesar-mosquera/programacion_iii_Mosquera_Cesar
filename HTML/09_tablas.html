<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablas en HTML5</title>
</head>

<body>
    <h1>Tablas en HTML5</h1>

    <table id="personajes_star_wars" border="1">
        <caption>Universo de Star wars</caption>
        <thead>
            <tr>
                <th colspan="3">Personaje Star wars</th>
            </tr>
            <tr>
                <th>Nombre</th>
                <th>Planeta</th>
                <th>Afiliación</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Luke Skywalker</td>
                <td rowspan="2">Tatooine</td>
                <td>Rebelde</td>
            </tr>
            <tr>
                <td>Darth Vader</td>
                <td>Sith</td>
            </tr>
            <tr>
                <td>Yoda</td>
                <td>Desconocido</td>
                <td>Jedi</td>
            </tr>
        </tbody>
    </table>

    <br>

    <table id="misiones" border="1">
        <caption>Misiones de Star Wars</caption>
        <thead>
            <tr>
                <th>Caballero Jedi</th>
                <th>Tipo de mision</th>
                <th>Droide</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Luke Skywalker</td>
                <td>Exploratoria</td>
                <td>R2D2</td>
            </tr>
            <tr>
                <td>Anakin</td>
                <td>Rescate</td>
                <td>C3PO</td>
            </tr>
            <tr>
                <td>Obi-Wan Kenobi</td>
                <td>Defensiva</td>
                <td>BB-8</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
