<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07 - Utilización de etiquetas img</title>
</head>
<body>
    <h1>Utilización de etiquetas de img</h1>

    <img 
        src="img/images.jpeg" 
        alt="Star Wars"
        width="200"
        loading="eager">

    <img 
        src="https://img.magnific.com/vector-premium/chico-lindo-sosteniendo-cafe-ilustracion-icono-vector-dibujos-animados-monopatin-gente-deporte-aislado-plano_138676-6357.jpg" 
        alt="Chico con café"
        width="200"
        loading="eager">

    <img 
        src="img/personajes/images (1).jpeg" 
        alt="Personaje" 
        width="200"
        loading="eager">

    <img 
        src="img/images.jpeg" 
        alt="Imagen en img" 
        width="200"
        loading="eager">

    <img 
        src="../imagenes/-francisco-negroni-wildlife-photographer-of-the-year_b066052e_241130151243_800x800.webp" 
        alt="Fotografía volcán Francisco Negroni" 
        width="200" 
        loading="eager">
    
    <figure>
        <img
            src="../imagenes/-francisco-negroni-wildlife-photographer-of-the-year_b066052e_241130151243_800x800.webp"
            alt="Fotografía volcán Francisco Negroni"
            width="200"
            loading="eager">
        <figcaption>
            Maestro Yoda, integrantes del Consejo Jedi
        </figcaption>
    </figure>

    <a href="https://upload.wikimedia.org/wikipedia/commons/c/ce/Star_wars2.svg?utm_source=es.wikipedia.org&utm_campaign=index&utm_content=original"
       target="_blank">
        <img 
            src="img/personajes/images (1).jpeg" 
            alt="Logo Star Wars" 
            width="200"
            loading="eager">
    </a>
</body>
</html>
