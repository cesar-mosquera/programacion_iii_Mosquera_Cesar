<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD con Arreglos</title>
    <script defer src="06_crud_arreglo_mp_cesar_mosquera.js"></script>
</head>
<body>
<h1>Control de Sacramentos</h1>

<h2>Registrar Sacramentos</h2>

<form id="formulario">
    <input type="text" id="nombre" placeholder="Nombre de la persona">

    <select id="sacramento">
        <option value="Bautismo">Bautismo</option>
        <option value="Primera Comunión">Primera Comunión</option>
        <option value="Confirmación">Confirmación</option>
        <option value="Matrimonio">Matrimonio</option>
    </select>

    <input type="date" id="fecha">

    <select id="estado">
        <option value="Pendiente">Pendiente</option>
        <option value="Completado">Completado</option>
    </select>

    <button type="submit" id="guardar">Agregar</button>

    <button type="button" id="cancelar" hidden>
        Cancelar
    </button>
</form>

  <h2>Sacramentos Registrados</h2>

    <h2 id="cantidad">Cantidad: 0</h2>

    <div id="contenedor"></div>
</body>
</html>
