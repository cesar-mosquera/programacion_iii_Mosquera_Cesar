<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores - Registro Parroquial</title>
    <style>
        body {
            background-color: #0b1020;
        }
        h1 {
            color: white;
        }
        h2 {
            color: #ff0000;
        }
        h3 {
            color: rgb(255, 0, 0);
        }
        h4 {
            color: rgba(255, 0, 0, 0.8);
        }
        h5 {
            color: hsl(0, 100%, 50%);
        }
    </style>
</head>

<body>
    <h1>Formatos de Color en el Sistema Parroquial</h1>
    <h1>Color por Nombre: Templo Principal (White)</h1>
    <h2>Hexadecimal (#ff0000): Registro de Matrimonio</h2>
    <h3>RGB rgb(255, 0, 0): Registro de Bautismo</h3>
    <h4>RGBA rgba(255, 0, 0, 0.8): Constancia de Confirmación</h4>
    <h5>HSL hsl(0, 100%, 50%): Horarios Litúrgicos y Eucaristía</h5>
</body>
</html>
