<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Celebración Sacramental - Animación e Integración</title>

    <link rel="stylesheet" href="19_trancisiones_integraciones_mp_cesar_mosquera.css">
</head>
<body>

    <header>
        <h1>Vigilia Sacramental</h1>

        <p>
            Representación simbólica de la luz y la gracia divina.
        </p>
    </header>

    <main>

        <section class="escena"
                 aria-label="Escena sacramental animada">

            <div class="estrella estrella1"></div>
            <div class="estrella estrella2"></div>
            <div class="estrella estrella3"></div>
            <div class="estrella estrella4"></div>
            <div class="estrella estrella5"></div>

            <div class="nave">
                <span aria-hidden="true">🕊</span>
                <p>Espíritu Santo</p>
            </div>

            <div class="alerta">
                TIEMPO DE COMUNIÓN
            </div>

        </section>

        <section class="controles">

            <h2>Centro Pastoral</h2>

            <div class="panel">

                <article class="radar-contenedor">

                    <h3>Foco de Gracia</h3>

                    <div class="radar"
                         aria-hidden="true">

                        <div class="pulso"></div>

                        <div class="centro"></div>

                    </div>

                </article>

                <article class="estado">

                    <h3>Estado Litúrgico</h3>

                    <p>
                        Celebración comunitaria activa.
                    </p>

                    <p>
                        Signo: Paloma de la Paz
                    </p>

                    <p>
                        Sede: Capilla Parroquial
                    </p>

                </article>

            </div>

        </section>

    </main>

    <footer>
        <p>Los Sacramentos - César Mosquera</p>
    </footer>

</body>
</html>
