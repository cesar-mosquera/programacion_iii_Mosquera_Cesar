<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="18_transiciones_mp_cesar_mosquera.css">
    <title>Transiciones y Animaciones - Los Sacramentos</title>
</head>
<body>
    <main>Comunidad Parroquial</main>    
    <p>Coloca el cursor sobre el botón</p>
    <button class="boton-jedi">
        Recibir Sacramento
    </button>
    <div class="tarjeta">
        <h2>Eucaristía</h2>
        <p>Fuente y Culmen</p>
    </div>
    <br>
    <br>
    <h1>Capilla Bautismal</h1>
    <div class="hangar">
        <div class="nave">Agua Viva</div>
    </div>

    <h1>Campanario Parroquial</h1>
    <div class="radar">
        <div class="indicador">✝</div>
    </div>

    <h1>Altar Mayor</h1>
    <div class="hangar2">
        <div class="nave2">Santo Crisma</div>
    </div>

    <h1>Procesión de Fe</h1>
    <div class="espacio">
        <div class="xwing">Cirio Pascual</div>
    </div>

    <h1>Elevación Eucarística</h1>
    <div class="espacio2">
        <div class="xwing2">Custodia</div>
    </div>

    <div class="alerta">Llamado a Oración</div>
</body>
</html>
