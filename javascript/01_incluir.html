<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Incluir Javascript en documento HTML</title>
    <script>
        alert('¡Corre, Morty! al Inicio de la Pagina');
        console.log('Saludo desde el Inicio de la pagina');
    </script>
</head>
<body>

    <h1>Incluir Javascript en documento HTML</h1>
    <h2>Modo Inline</h2>


    <button onclick="alert('¡Corre, Morty!')">
        Mostrar Mensaje
    </button>

    <input type="text" 
           oninput="console.log(this.value)" 
           placeholder="Escribe algo...">


    <br><br>

    <input type="text" 
           onchange="console.log('Valor final guardado:', this.value)" 
           placeholder="Escribe y haz clic fuera...">

    <input type="text" 
           onfocus="console.log('El usuario está escribiendo aquí...')" 
           onblur="alert('¡Atención! Saliste del campo de texto.')" 
           placeholder="Haz clic dentro y fuera...">
    <script src="01_incluir.js"></script>

</body>
</html>
